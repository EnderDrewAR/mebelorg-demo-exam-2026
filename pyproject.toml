[project]
name = "mebelorg-demo"
version = "1.0.0"
description = "Django application for the 2026 demonstration exam"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "django>=5.2,<5.3",
    "pillow>=11,<13",
    "psycopg[binary]>=3.2,<4",
    "python-dotenv>=1.1,<2",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<10",
    "pytest-django>=4.11,<5",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py", "tests.py"]
addopts = "-q"
norecursedirs = [".build", ".venv", "release", "staticfiles"]
pythonpath = ["src"]
testpaths = ["src"]
